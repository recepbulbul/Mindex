[project]
name = "mindex"
version = "0.1.0"
description = "Mindex: kalıcı hafıza ve güven tabanlı forumla birlikte öğrenen kripto ticaret ajanları arenası"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Recep Bülbül" },
    { name = "Meryem Arpacı" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "ccxt>=4.5.91",
    "fastapi>=0.115",
    "pgvector>=0.3",
    "polars>=2.1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.scripts]
mindex = "mindex.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
eda = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindex"]

# --- Ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "PT",       # pytest style
    "RUF",
]
allowed-confusables = ["ı"]  # Turkish dotless i is intentional in Turkish text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

# --- Pyright ------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# --- Pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mindex --cov-report=term-missing --cov-fail-under=70"
markers = [
    "db: needs PostgreSQL + pgvector (docker compose up -d db); skipped when unreachable",
    "model: needs a real model (llama-server, embedding, trained PPO); run with -m model",
]

[tool.coverage.run]
branch = true
source = ["mindex"]

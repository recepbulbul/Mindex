# Yerel geliştirme servisleri: `docker compose up -d db`
# CI aynı imajı servis konteyneri olarak kullanır (.github/workflows/ci.yml).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mindex
      POSTGRES_PASSWORD: mindex # yalnızca yerel geliştirme; üretim parolası .env'den gelir
      POSTGRES_DB: mindex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindex -d mindex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
